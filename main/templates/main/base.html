<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Geladeira de Compras — Dominus System{% endblock %}</title>

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background-color: #080c14; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; }
        .bg-dominus-card { background: #111827; border: 1px solid rgba(255, 255, 255, 0.08) !important; border-radius: 12px; }
        input[type="text"], input[type="number"], select { background-color: #1f2937 !important; border: 1px solid #374151 !important; color: #ffffff !important; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Navbar Responsiva com Hambúrguer (Semana 8) -->
    <nav class="navbar navbar-expand-lg navbar-dark border-bottom border-secondary border-opacity-25 py-2 mb-4" style="background-color: #0e1420;">
        <div class="container-fluid px-4">
            
            <a href="{% url 'painel' %}" class="navbar-brand d-flex align-items-center gap-2 fw-bold">
                <span class="fs-4">🧊</span> DOMINUS <span class="text-success">SYS</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMobile" aria-controls="navbarMobile" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMobile">
                <div class="ms-auto d-flex flex-column flex-lg-row align-items-lg-center gap-2 mt-2 mt-lg-0">
                    <a href="{% url 'registrar_operador' %}" class="btn btn-outline-info btn-sm font-monospace">+ Registrar Operador</a>
                    <a href="{% url 'admin:logout' %}" class="btn btn-outline-danger btn-sm">Sair</a>
                </div>
            </div>

        </div>
    </nav>

    <main class="container-fluid px-4 flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-3 border-top border-secondary border-opacity-10 mt-auto text-muted small">
        &copy; 2026 <strong>Geladeira de Compras</strong> — Módulo Web & APIs | SENAI Piauí
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
