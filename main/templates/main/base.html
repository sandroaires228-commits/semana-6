<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOMINUS SYS — Geladeira de Compras</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        .navbar-custom {
            background-color: #111827;
            border-bottom: 1px solid #1f2937;
        }
    </style>
</head>
<body>

    <!-- NAVBAR SUPERIOR COM LOGOUT -->
    <nav class="navbar navbar-expand-lg navbar-custom py-3 mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-white fs-4" href="{% url 'painel' %}">
                <span class="p-1 rounded bg-info bg-opacity-10 text-info">🧊</span>
                <span>DOMINUS</span> <span class="text-info fs-6">SYS</span>
            </a>

            <button class="navbar-toggler border-0 text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarContent">
                <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0">
                    {% if user.is_authenticated %}
                        <span class="text-muted small">
                            Operador: <strong class="text-info">{{ user.username }}</strong>
                        </span>
                    {% endif %}

                    <a href="{% url 'registrar_operador' %}" class="btn btn-outline-info btn-sm fw-bold px-3">
                        + Registrar Operador
                    </a>

                    <!-- FORMULÁRIO DE LOGOUT (MÉTODO POST) -->
                    <form action="{% url 'logout' %}" method="post" class="d-inline m-0">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-danger btn-sm fw-bold px-3">
                            Sair
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <!-- CONTEÚDO PRINCIPAL DA PÁGINA -->
    <main class="px-4 pb-5">
        {% block content %}
        {% endblock %}
    </main>

    <!-- FOOTER CORPORATIVO -->
    <footer class="text-center py-3 text-muted border-top border-secondary border-opacity-10 small mt-auto">
        © 2026 Geladeira de Compras — Módulo Web & APIs | SENAI Piauí
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
