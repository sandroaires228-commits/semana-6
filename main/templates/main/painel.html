<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Financeiro — Anti-Impulso</title>
    <!-- Importação Estática do Bootstrap 5 via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Barra de Navegação Superior -->
    <nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">SENAI — Controle Financeiro & Anti-Impulso</span>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <div class="container my-4">
        <div class="row">
            <div class="col-md-8 mx-auto">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="card-title mb-0">Resumo de Auditoria Financeira</h5>
                    </div>
                    <div class="card-body">
                        <p class="card-text text-muted">Último gasto registrado e analisado pelo sistema:</p>

                        <ul class="list-group list-group-flush mb-4">
                            <!-- Injeção de Variáveis via DTL -->
                            <li class="list-group-item">
                                <strong>Descrição do Item:</strong> {{ gasto_descricao }}
                            </li>
                            <li class="list-group-item">
                                <strong>Valor:</strong> <span class="text-success fw-bold">R$ {{ gasto_valor }}</span>
                            </li>
                            <li class="list-group-item">
                                <strong>Gatilho de Consumo:</strong> <code>{{ gasto_gatilho }}</code>
                            </li>
                            <li class="list-group-item">
                                <strong>Status do Consumo:</strong>
                                <span class="badge bg-warning text-dark">Análise de Impulsividade</span>
                            </li>
                        </ul>

                        <div class="text-center">
                            <button class="btn btn-outline-primary btn-sm" onclick="location.reload()">
                                Recarregar Dados
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
