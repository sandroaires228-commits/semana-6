{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PI.ISO SYS — Controle Financeiro</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #060D19;
            --bg-card: #0D172A;
            --border-glass: rgba(255, 255, 255, 0.12);
            --brand-sky: #00B4D8;
            --brand-sky-hover: #00C4EE;
            --brand-sky-glow: rgba(0, 180, 216, 0.25);
            --text-primary: #FFFFFF;
            --text-secondary: #CBD5E1;
            --text-muted: #94A3B8;
        }

        body {
            background-color: var(--bg-main) !important;
            color: var(--text-primary) !important;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
        }

        .navbar-pi {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-glass);
            padding: 0.85rem 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .brand-title {
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            text-decoration: none;
        }

        .text-sky {
            color: var(--brand-sky) !important;
            text-shadow: 0 0 12px var(--brand-sky-glow);
        }

        .btn-outline-sky {
            border: 1px solid var(--brand-sky);
            color: var(--brand-sky) !important;
            background: transparent;
            font-weight: 600;
            transition: all 0.2s ease-in-out;
        }

        .btn-outline-sky:hover {
            background-color: var(--brand-sky);
            color: #060D19 !important;
            box-shadow: 0 0 15px var(--brand-sky-glow);
        }

        .text-light-custom {
            color: var(--text-secondary) !important;
            font-weight: 500;
        }

        .form-control-pi {
            background-color: #060D19 !important;
            border: 1px solid var(--border-glass) !important;
            color: #FFF !important;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- NAVBAR PRINCIPAL LIMPA E ENTERPRISE -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-pi mb-4">
        <div class="container-fluid">
            <!-- BRANDING LIMPO -->
            <a class="navbar-brand brand-title d-flex align-items-center gap-2" href="{% if user.is_authenticated %}{% url 'painel' %}{% else %}{% url 'login' %}{% endif %}">
                <span class="fs-4" role="img" aria-label="Balança de Precisão">⚖️</span>
                <span>PI.ISO <span class="text-sky">SYS</span></span>
            </a>

            <!-- AÇÕES EXIBIDAS EXCLUSIVAMENTE APÓS AUTENTICAÇÃO NO PAINEL -->
            {% if user.is_authenticated and request.resolver_match.url_name != 'login' %}
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse justify-content-end" id="navbarContent">
                    <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0">
                        <span class="text-light-custom small">
                            Operador: <strong class="text-sky">{{ user.username }}</strong>
                        </span>

                        <!-- CADASTRAR NOVO USUÁRIO -->
                        <button type="button" class="btn btn-outline-sky btn-sm fw-bold px-3" data-bs-toggle="modal" data-bs-target="#modalNovoUsuario">
                            👥 Cadastrar Usuário
                        </button>

                        <!-- SAIR DA SESSÃO -->
                        <form action="{% url 'logout' %}" method="post" class="d-inline m-0">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-outline-danger btn-sm fw-bold px-3">
                                🚪 Sair
                            </button>
                        </form>
                    </div>
                </div>
            {% endif %}
        </div>
    </nav>

    <!-- MODAL DE CADASTRO (MANTIDO PARA USO DENTRO DO PAINEL) -->
    <div class="modal fade" id="modalNovoUsuario" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background-color: #0D172A; border: 1px solid rgba(255,255,255,0.15); color: #FFF;">
                <div class="modal-header border-bottom border-secondary border-opacity-20">
                    <h5 class="modal-title fw-bold text-sky">👥 Cadastrar Novo Usuário / Operador</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form action="{% url 'registrar_operador' %}" method="POST">
                    {% csrf_token %}
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label text-muted small">Nome de Usuário (Username)</label>
                            <input type="text" name="username" class="form-control form-control-pi" placeholder="Ex: operador2" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">E-mail (Opcional)</label>
                            <input type="email" name="email" class="form-control form-control-pi" placeholder="operador@pi-iso.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small">Senha</label>
                            <input type="password" name="password" class="form-control form-control-pi" required>
                        </div>
                    </div>
                    <div class="modal-footer border-top border-secondary border-opacity-20">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-outline-sky btn-sm fw-bold">Cadastrar e Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
